name: RupeeFlow CI & Release Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install & Run OSV-Scanner
        run: |
          curl -L -s https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -r --allow-no-lockfiles .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Kotlin & Room Schema Compilation
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Execute Unit & Database Test Suite
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate Automated Test Summary
        if: always()
        run: |
          if [ -d "app/build/test-results/testDebugUnitTest" ]; then
            TOTAL_TESTS=$(grep -h "testsuite" app/build/test-results/testDebugUnitTest/*.xml | sed -n 's/.*tests="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
            FAILURES=$(grep -h "testsuite" app/build/test-results/testDebugUnitTest/*.xml | sed -n 's/.*failures="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
            SKIPPED=$(grep -h "testsuite" app/build/test-results/testDebugUnitTest/*.xml | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
            ERRORS=$(grep -h "testsuite" app/build/test-results/testDebugUnitTest/*.xml | sed -n 's/.*errors="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
            PASSED=$((TOTAL_TESTS - FAILURES - ERRORS - SKIPPED))
            echo "### Automated Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Release Signing & Build Production Artifacts
        id: release_build
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Production release signing secrets detected. Decoding release keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

            echo "Verifying release keystore validity with keytool..."
            keytool -list -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}"

            CERT_SHA256=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" | grep "SHA256:" | head -n 1 | awk '{print $2}')
            echo "Verified release certificate SHA-256 fingerprint: $CERT_SHA256"

            export KEYSTORE_FILE="$GITHUB_WORKSPACE/release.keystore"
            export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

            echo "Building production release APK and App Bundle..."
            ./gradlew assembleRelease bundleRelease --no-daemon

            echo "Verifying release APK package ID and version name..."
            AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
            if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
              $AAPT2 dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='com.naman.rupeeflow'"
            fi

            echo "Asserting release artifacts are not signed with debug key..."
            APK_CERT_INFO=$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk)
            if echo "$APK_CERT_INFO" | grep -q "CN=Android Debug"; then
              echo "ERROR: Artifact signed with debug key!"
              exit 1
            fi

            echo "release_built=true" >> $GITHUB_OUTPUT
            echo "### Release Build Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "Production signed release artifacts generated successfully." >> $GITHUB_STEP_SUMMARY
            echo "Certificate SHA-256: \`$CERT_SHA256\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning title=RELEASE BLOCKED::Production release signing secrets not configured in repository."
            echo "=================================================================="
            echo "RELEASE BLOCKED: Production release secrets are not configured."
            echo "Required repository secrets:"
            echo "  - KEYSTORE_BASE64: Base64-encoded release.keystore"
            echo "  - KEYSTORE_PASSWORD: Password for the release keystore"
            echo "  - KEY_ALIAS: Key alias name"
            echo "  - KEY_PASSWORD: Password for the release key"
            echo "No production APK or AAB will be fabricated or uploaded."
            echo "=================================================================="
            echo "release_built=false" >> $GITHUB_OUTPUT
            echo "### Release Build Status: RELEASE BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "> **RELEASE BLOCKED**: Production release signing secrets are not configured in repository secrets." >> $GITHUB_STEP_SUMMARY
            echo "To generate signed release artifacts, configure the following repository secrets:" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEYSTORE_BASE64\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEYSTORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clean Up Release Keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request' && steps.release_build.outputs.release_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Artifact
        if: github.event_name != 'pull_request' && steps.release_build.outputs.release_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
